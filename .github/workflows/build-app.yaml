name: React Native CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - dev
          - prod-apk
          - prod-aab
          - all

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --openssl-legacy-provider
  # Gradle optimization settings
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  test:
    needs: check-skip
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Setup npm cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 📦 Install dependencies
        run: npm ci

      # - name: 🧪 Run TypeScript check
      #   run: npx tsc --noEmit

      - name: 🧹 Run ESLint
        run: npm run lint

  build-and-deploy:
    needs: test
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Setup npm cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 🏗 Setup Gradle cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗 Setup Android SDK cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/android/app/build.gradle', '**/android/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: 📦 Setup Metro cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules/.cache
            .metro-health-check*
          key: ${{ runner.os }}-metro-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-metro-

      - name: 📦 Install dependencies
        run: |
          npm ci
          npm install -g eas-cli@latest

      - name:  Verify EAS CLI installation
        run: |
          echo "EAS CLI version:"
          eas --version

      # - name: 📋 Fix package.json main entry
      #   run: |
      #     # Check if jq is installed, if not install it
      #     if ! command -v jq &> /dev/null; then
      #       echo "Installing jq..."
      #       sudo apt-get update && sudo apt-get install -y jq
      #     fi

      #     # Fix the main entry in package.json
      #     if [ -f ./package.json ]; then
      #       # Create a backup
      #       cp package.json package.json.bak
      #       # Update the package.json
      #       jq '.main = "node_modules/expo/AppEntry.js"' package.json > package.json.tmp && mv package.json.tmp package.json
      #       echo "Updated package.json main entry"
      #       cat package.json | grep "main"
      #     else
      #       echo "package.json not found"
      #       exit 1
      #     fi

      # - name: 📱 Build Development APK
      #   if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'dev' || github.event_name == 'push'
      #   run: |
      #     # Build with increased memory limit and Gradle optimizations
      #     export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
      #     export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true"
      #     eas build --platform android --profile development --local --non-interactive --output=./app-dev.apk
      #   env:
      #     NODE_ENV: development

      - name: 📱 Build Production APK
        if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-apk' || github.event_name == 'push'
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          # Enable Gradle optimizations
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true"
          eas build --platform android --profile production-apk --local --non-interactive --output=./app-prod.apk
        env:
          NODE_ENV: production

      # - name: 📱 Build Production AAB
      #   if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-aab' || github.event_name == 'push'
      #   run: |
      #     export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
      #     export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true"
      #     eas build --platform android --profile production --local --non-interactive --output=./app-prod.aab
      #   env:
      #     NODE_ENV: production

      - name: 📦 Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-builds
          path: |
            ./app-dev.apk
            ./app-prod.apk
            ./app-prod.aab
          retention-days: 7
          if-no-files-found: ignore
