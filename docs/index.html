<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinat - Ethiopian Orthodox Tewahido Bible App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ethiopic font for Amharic text */
        .ethiopic-text {
            font-family: 'Noto Sans Ethiopic', 'Nyala', 'Ethiopia Jiret', 'Ethiopian', serif;
        }

        /* Animated Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: 
                linear-gradient(rgba(255,107,53,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,107,53,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            z-index: -2;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,107,53,0.1), transparent);
            filter: blur(1px);
            animation: float 15s infinite ease-in-out;
            z-index: -1;
        }

        .orb:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 15%;
            animation-delay: 5s;
        }

        .orb:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 80%;
            left: 60%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            33% { transform: translateY(-30px) translateX(20px); }
            66% { transform: translateY(20px) translateX(-15px); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
        }

        .hero {
            text-align: center;
            margin-bottom: 80px;
        }

        .status-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(255,140,66,0.1));
            border: 1px solid rgba(255,107,53,0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #ff8c42;
            margin-bottom: 32px;
            transform: rotate(-1deg);
            backdrop-filter: blur(10px);
        }

        .app-title {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 20%, #ff6b35 80%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .orthodox-subtitle {
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 400;
            color: rgba(255,107,53,0.9);
            margin-bottom: 24px;
            letter-spacing: 0.02em;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.6);
            max-width: 400px;
            margin: 0 auto 48px;
            line-height: 1.5;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transform: rotate(1deg);
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(255,107,53,0.3);
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: rotate(0deg) translateY(-2px);
            box-shadow: 0 12px 40px rgba(255,107,53,0.4);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 800px;
            width: 100%;
        }

        .feature-card {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 32px 24px;
            transition: all 0.4s ease;
            position: relative;
        }

        .feature-card:nth-child(1) { transform: rotate(-2deg); }
        .feature-card:nth-child(2) { transform: rotate(1deg); }
        .feature-card:nth-child(3) { transform: rotate(-1deg); }
        .feature-card:nth-child(4) { transform: rotate(2deg); }
        .feature-card:nth-child(5) { transform: rotate(-1.5deg); }
        .feature-card:nth-child(6) { transform: rotate(0.5deg); }

        .feature-card:hover {
            transform: rotate(0deg) translateY(-8px);
            background: rgba(255,107,53,0.08);
            border-color: rgba(255,107,53,0.2);
            box-shadow: 0 20px 40px rgba(255,107,53,0.1);
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff6b35, transparent);
            border-radius: 16px 16px 0 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }

        .feature-description {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }

        .language-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex !important;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 4px;
            transform: rotate(1deg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            visibility: visible;
            opacity: 1;
        }

        .lang-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 40px;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            box-shadow: 0 4px 12px rgba(255,107,53,0.4);
        }

        .lang-btn:hover:not(.active) {
            color: white;
            background: rgba(255,255,255,0.15);
        }

        .social-links {
            display: flex;
            gap: 16px;
            margin-top: 48px;
            justify-content: center;
        }

        .social-link {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            transform: rotate(-1deg);
        }

        .social-link:hover {
            background: rgba(255,107,53,0.1);
            border-color: rgba(255,107,53,0.3);
            color: #ff6b35;
            transform: rotate(0deg);
        }

        .lang-content {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .lang-content.switching {
            opacity: 0;
            transform: translateY(10px);
        }

        @media (max-width: 768px) {
            .features-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .feature-card:nth-child(odd) { transform: rotate(-1deg); }
            .feature-card:nth-child(even) { transform: rotate(1deg); }
            
            .social-links {
                flex-wrap: wrap;
            }
            
            main {
                padding: 40px 0;
            }

            .language-toggle {
                top: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>

    <div class="container">
        <div class="language-toggle">
            <button class="lang-btn active" data-lang="am">አማ</button>
            <button class="lang-btn" data-lang="en">EN</button>
        </div>

        <main>
            <div class="hero">
                <div class="status-badge lang-content" data-key="status"></div>
                <h1 class="app-title lang-content" data-key="appTitle"></h1>
                <p class="orthodox-subtitle lang-content ethiopic-text" data-key="orthodoxSubtitle"></p>
                <p class="subtitle lang-content" data-key="subtitle"></p>
                <button class="cta-button lang-content" data-key="ctaButton">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                    </svg>
                </button>
            </div>

            <div class="features-grid">
                <div class="feature-card">
                    <h3 class="feature-title lang-content" data-key="feature1Title"></h3>
                    <p class="feature-description lang-content" data-key="feature1Desc"></p>
                </div>

                <div class="feature-card">
                    <h3 class="feature-title lang-content" data-key="feature2Title"></h3>
                    <p class="feature-description lang-content" data-key="feature2Desc"></p>
                </div>

                <div class="feature-card">
                    <h3 class="feature-title lang-content" data-key="feature3Title"></h3>
                    <p class="feature-description lang-content" data-key="feature3Desc"></p>
                </div>

                <div class="feature-card">
                    <h3 class="feature-title lang-content" data-key="feature4Title"></h3>
                    <p class="feature-description lang-content" data-key="feature4Desc"></p>
                </div>

                <div class="feature-card">
                    <h3 class="feature-title lang-content" data-key="feature5Title"></h3>
                    <p class="feature-description lang-content" data-key="feature5Desc"></p>
                </div>

                <div class="feature-card">
                    <h3 class="feature-title lang-content" data-key="feature6Title"></h3>
                    <p class="feature-description lang-content" data-key="feature6Desc"></p>
                </div>
            </div>

            <div class="social-links">
                <a href="https://github.com/tib-source" class="social-link" title="GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                </a>
                <a href="https://tibebe.co.uk" class="social-link" title="Community">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </a>
            </div>
        </main>
    </div>

    <script>
        const translations = {
            am: {
                status: "በቅርቡ በGoogle Play",
                appTitle: "ጥናት",
                orthodoxSubtitle: "የኢትዮጵያ ኦርቶዶክስ ተዋሕዶ መጽሐፍ ቅዱስ",
                subtitle: "ቅዱስ መጽሐፍን በዘመናዊ መንገድ ያንብቡ",
                ctaButton: "ማሳወቂያ ይቀበሉ",
                feature1Title: "የአንባቢ ተሞክሮ",
                feature1Desc: "ዕለታዊ ንባብ ሰንሰለት ይገንቡ እና ደረጃዎችን ያግኙ",
                feature2Title: "የበዓላት ካላንደር",
                feature2Desc: "የኢትዮጵያ ኦርቶዶክስ በዓላትና ጾማት ካላንደር",
                feature3Title: "ባለሁለት ቋንቋ",
                feature3Desc: "በአማርኛና እንግሊዝኛ ቋንቋ ያንብቡ",
                feature4Title: "ንጹህ ንድፍ",
                feature4Desc: "ቀላል እና ውብ የተጠቃሚ ገጽታ",
                feature5Title: "ጽሑፍ ማድመቅ",
                feature5Desc: "አስፈላጊ ቃላትን ያድምቁ እና ማስታወሻ ያድርጉ",
                feature6Title: "ክፍት ምንጭ",
                feature6Desc: "ለማህበረሰቡ በማህበረሰቡ የተገነባ"
            },
            en: {
                status: "Coming Soon to Google Play",
                appTitle: "Tinat",
                orthodoxSubtitle: "Ethiopian Orthodox Tewahido Bible",
                subtitle: "Read the Holy Bible in a modern way",
                ctaButton: "Get Notified",
                feature1Title: "Reading Experience",
                feature1Desc: "Build daily reading streaks and earn achievements",
                feature2Title: "Festival Calendar",
                feature2Desc: "Ethiopian Orthodox festivals and fasting calendar",
                feature3Title: "Bilingual Support",
                feature3Desc: "Read in both Amharic and English languages",
                feature4Title: "Clean Design",
                feature4Desc: "Simple and beautiful user interface",
                feature5Title: "Text Highlighting",
                feature5Desc: "Highlight important words and take notes",
                feature6Title: "Open Source",
                feature6Desc: "Built by the community for the community"
            }
        };

        class LanguageToggle {
            constructor() {
                this.currentLang = 'am';
                this.langButtons = document.querySelectorAll('.lang-btn');
                this.langContent = document.querySelectorAll('.lang-content');
                this.init();
                this.updateContent();
            }

            init() {
                this.langButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const targetLang = e.target.dataset.lang;
                        if (targetLang !== this.currentLang) {
                            this.switchLanguage(targetLang);
                        }
                    });
                });
            }

            switchLanguage(targetLang) {
                this.langContent.forEach(element => {
                    element.classList.add('switching');
                });

                setTimeout(() => {
                    this.currentLang = targetLang;
                    this.updateContent();
                    this.updateActiveButton();

                    setTimeout(() => {
                        this.langContent.forEach(element => {
                            element.classList.remove('switching');
                        });
                    }, 50);
                }, 150);
            }

            updateContent() {
                const currentTranslations = translations[this.currentLang];
                
                this.langContent.forEach(element => {
                    const key = element.dataset.key;
                    if (key && currentTranslations[key]) {
                        element.textContent = currentTranslations[key];
                    }
                });

                this.langContent.forEach(element => {
                    if (this.currentLang === 'am' && element.classList.contains('ethiopic-text')) {
                        element.classList.add('ethiopic-text');
                    } else if (this.currentLang === 'en') {
                        element.classList.remove('ethiopic-text');
                    }
                });
            }

            updateActiveButton() {
                this.langButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === this.currentLang);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new LanguageToggle();
        });

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        window.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.orb');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 0.5;
                const xMove = (x - 0.5) * speed * 20;
                const yMove = (y - 0.5) * speed * 20;
                
                orb.style.transform = `translate(${xMove}px, ${yMove}px)`;
            });
        });
    </script>
</body>
</html>
